# This workflow will build a golang project

name: goemu-ci

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.2'
    - name: Test
      working-directory: /home/runner/work/goemu
      run: go test -v ./...

    - name: Build
      working-directory: /home/runner/work/goemu
      run: go build -v ./...

    
